name: Build Tehran RP Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download & Extract Source Code
        run: |
          curl -L -o source.zip https://github.com/${{ github.repository }}/releases/download/v1.0/TehranRp-Launcher-Source.zip
          unzip -o source.zip
          
          ROOT_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          if [ "$ROOT_DIR" != "." ] && [ -n "$ROOT_DIR" ]; then
            cp -r "$ROOT_DIR"/* . || true
          fi
          chmod +x gradlew || true

      - name: Fix Deprecated Dependencies
        run: |
          # اصلاح نام کتابخانه اسلایدر
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/com.github.smarteist:autoimageslider/com.github.smarteist:Android-Image-Slider/g' {} +
          
          # اضافه کردن خط جدید برای جلوگیری از چسبیدن به خط قبلی
          printf "\nandroid.enableJetifier=true\n" >> gradle.properties

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TehranRp-Launcher-APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Attach APK to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0
          files: '**/build/outputs/apk/**/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
