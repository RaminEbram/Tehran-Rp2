name: Build Tehran RP Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download & Extract Source Code
        run: |
          curl -L -o source.zip https://github.com/${{ github.repository }}/releases/download/v1.0/TehranRp-Launcher-Source.zip
          unzip -o source.zip
          
          ROOT_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          if [ "$ROOT_DIR" != "." ] && [ -n "$ROOT_DIR" ]; then
            cp -r "$ROOT_DIR"/* . || true
          fi
          chmod +x gradlew || true

      - name: Bundle All Legacy Libraries Offline
        run: |
          mkdir -p app/libs libs
          
          # دانلود مستقیم هر ۳ کتابخانه مورد نیاز پروژه به صورت فایل محلی
          curl -L -o app/libs/un7zip.aar https://repo1.maven.org/maven2/com/hzy/un7zip/1.6.0/un7zip-1.6.0.aar
          curl -L -o app/libs/prdownloader.aar https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/PRDownloader/1.0.1/PRDownloader-1.0.1.aar
          curl -L -o app/libs/imageslider.aar https://jitpack.io/com/github/smarteist/Android-Image-Slider/1.4.0/Android-Image-Slider-1.4.0.aar
          cp app/libs/*.aar libs/ || true

          # اتصال مستقیم پروژه به فایل‌های دانلود شده به جای سرورهای از کار افتاده
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E "s|['\"][^'\"]*un7zip[^'\"]*['\"]|files('libs/un7zip.aar')|g" {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E "s|['\"][^'\"]*prdownloader[^'\"]*['\"]|files('libs/prdownloader.aar')|g" {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E "s|['\"][^'\"]*autoimageslider[^'\"]*['\"]|files('libs/imageslider.aar')|g" {} +

          # تغییر مخازن از jcenter به mavenCentral
          find . -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          
          # تنظیمات AndroidX
          echo "" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TehranRp-Launcher-APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Attach APK to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0
          files: '**/build/outputs/apk/**/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
